site_name: COBRA Documentation
site_description: >-
  Documentation for COBRA - A Circuit-Level Open-Source Based RFIC AI-Assisted Optimizer

# Repository
repo_name: DI-PASSIONATE/COBRA
repo_url: https://github.com/DI-PASSIONATE/COBRA
edit_uri: edit/main/docs/

# Page tree
nav:
  - Home: index.md
  - Getting Started:
    - Installation: setup.md
    - Quickstart: getting-started/quickstart.md
  - User Guide:
    - GUI Mode: user-guide/gui.md
    - Script Mode: user-guide/scripting.md
    - Examples: user-guide/examples.md
  - Support:
    - Troubleshooting: advanced/troubleshooting.md
    - FAQ: advanced/faq.md
  - API Reference:
    - Overview: api/index.md
    - Core: api/core.md
    - Optimizers: api/optimizers.md
    - Simulation and Netlist Parsing: api/simulation.md
  - Advanced:
    - Harmonic Balance: advanced/harmonic-balance.md
    - Fine-Tuning: advanced/fine-tuning.md
  
# Configuration
theme:
  name: material
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    # - content.code.select
    # - content.tabs.link
    - content.tooltips
    # - header.autohide
    # - navigation.expand
    - navigation.footer
    - navigation.indexes
    # - navigation.instant
    # - navigation.prune
    - navigation.sections
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

# Plugins
plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

# Additional configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DI-PASSIONATE/COBRA

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
          - name: mermaid
            class: mermaid
            format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.tilde
